name: API

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  custom-vec-types:
    runs-on: ubuntu-latest
    name: Custom vector types (IAM_VEC2/IAM_VEC4)

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout Dear ImGui
        run: git submodule update --init --depth 1 examples/extern/imgui

      - name: Build and compare default vs custom vector types
        run: sh tests/vec_types/run.sh

  clip-editor:
    runs-on: ubuntu-latest
    name: Clip editor (headless) and exported code

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout Dear ImGui
        run: git submodule update --init --depth 1 examples/extern/imgui

      - name: Drive the editor and compile its exported code
        run: sh tests/clip_editor/run.sh

  springs:
    runs-on: ubuntu-latest
    name: Spring channels and tween queries

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout Dear ImGui
        run: git submodule update --init --depth 1 examples/extern/imgui

      - name: Run
        run: sh tests/springs/run.sh

  presence:
    runs-on: ubuntu-latest
    name: Presence and path drawing

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout Dear ImGui
        run: git submodule update --init --depth 1 examples/extern/imgui

      - name: Run
        run: sh tests/presence/run.sh

  motion:
    runs-on: ubuntu-latest
    name: Layout, scroll triggers and inertia

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout Dear ImGui
        run: git submodule update --init --depth 1 examples/extern/imgui

      - name: Run
        run: sh tests/motion/run.sh

  utils:
    runs-on: ubuntu-latest
    name: Reduced motion, velocity tracking, SVG import, text scramble

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout Dear ImGui
        run: git submodule update --init --depth 1 examples/extern/imgui

      - name: Run
        run: sh tests/utils/run.sh

  clip-control:
    runs-on: ubuntu-latest
    name: Clip playhead control and labels

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout Dear ImGui
        run: git submodule update --init --depth 1 examples/extern/imgui

      - name: Run
        run: sh tests/clip_control/run.sh

  ease:
    runs-on: ubuntu-latest
    name: Curve eases and ease editor

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout Dear ImGui
        run: git submodule update --init --depth 1 examples/extern/imgui

      - name: Run
        run: sh tests/ease/run.sh

  extras:
    runs-on: ubuntu-latest
    name: Text split, stagger values, state blending

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout Dear ImGui
        run: git submodule update --init --depth 1 examples/extern/imgui

      - name: Run
        run: sh tests/extras/run.sh

  bench:
    runs-on: ubuntu-latest
    name: Performance benchmarks

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout Dear ImGui
        run: git submodule update --init --depth 1 examples/extern/imgui

      - name: Run
        run: sh tests/bench/run.sh
